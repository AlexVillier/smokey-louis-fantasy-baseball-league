version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: slfbl-backend
    restart: always
    environment:
      DJANGO_SETTINGS_MODULE: slfbl.production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-replace-this-with-a-secret}
      DJANGO_ALLOWED_HOSTS: villier.org,www.villier.org,localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: https://villier.org,http://localhost:5173,http://127.0.0.1:5173
      CSRF_TRUSTED_ORIGINS: https://villier.org,http://localhost:5173,http://127.0.0.1:5173
    expose:
      - "8000"
    volumes:
      - ./django_slfbl/db.sqlite3:/app/django_slfbl/db.sqlite3

  frontend:
    build:
      context: ./slfbl-app
      dockerfile: Dockerfile
    image: slfbl-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

networks:
  default:
    name: slfbl-network
